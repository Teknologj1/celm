<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Painel do Guia CELM</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="tela-login">
  <main class="cartao-login">
    <div class="marca" style="justify-content:center;margin-bottom:22px">
      <span class="marca-sigla" aria-hidden="true">CELM</span>
      <span class="marca-texto">
        <b>Painel da administração</b>
        <span>Guia de empresas do complexo</span>
      </span>
    </div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="campo" style="margin-top:14px">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>

      <p id="aviso" class="aviso-erro" role="alert" hidden></p>

      <button class="btn" type="submit" style="width:100%;margin-top:20px">Entrar</button>
    </form>

    <p class="rodape-login">
      Acesso restrito à administração do condomínio.
      <a href="/">Voltar ao site</a>
    </p>
  </main>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
