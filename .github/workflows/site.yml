name: Site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Gerar e verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O HTML não é versionado: cada publicação reconstrói o site a partir
      # de data/, que é o que o painel da administração altera.
      - name: Gerar o site
        run: node build.js

      - name: Verificar links e metadados
        run: node build/verificar.js

